services:

  api:
    environment:
      #- DOCLEANER_CONF=/etc/docleaner.conf
      #- DOCLEANER_LOGLVL=info
      - DOCLEANER_URL=https://docleaner.example.com
    image: docleaner/api:$REVISION
    networks:
      - docleaner
    restart: unless-stopped
    security_opt:
      - label=type:container_runtime_t
    volumes:
      - ${PWD}/docleaner.conf:/etc/docleaner.conf:Z
      #- <path/to/podman.sock>:/run/ext_podman.sock:z

  proxy:
    image: docker.io/library/nginx:stable
    networks:
      - docleaner
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: unless-stopped
    volumes:
      - ${PWD}/nginx.tls.conf:/etc/nginx/nginx.conf:Z
      #- <path/to/tls.crt>:/srv/tls.crt:z
      #- <path/to/tls.key>:/srv/tls.key:z

  database:
    image: docker.io/library/mongo:6
    networks:
      - docleaner
    restart: unless-stopped
    #volumes:
    #  - <path/to/data>:/data/db:Z

networks:
  docleaner:
