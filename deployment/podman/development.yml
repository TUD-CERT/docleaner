services:

  api:
    build:
      context: ${PWD}
      dockerfile: deployment/podman/Containerfile.api.dev
    environment:
      - DOCLEANER_CONF=/etc/docleaner.conf
    networks:
      - docleaner-dev
    security_opt:
      - label=type:container_runtime_t
    volumes:
      - ${PWD}/api:/mnt:Z
      - ${DOCLEANER_PODMAN_SOCKET}:/run/ext_podman.sock

  proxy:
    image: nginx:stable
    networks:
      - docleaner-dev
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ${PWD}/deployment/podman/nginx.dev.conf:/etc/nginx/nginx.conf:Z

  database:
    image: mongo:6
    networks:
      - docleaner-dev

networks:
  docleaner-dev:
